# Unified service: PSX + MUFAP + dashboard in one container.
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down

services:
  psx-service:
    build: .
    container_name: psx-service
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      LOG_FORMAT: json
      SNAPSHOT_STORE: memory
      SCHEDULER_ENABLED: "true"
      PSX_INTERVAL_OPEN_SECONDS: "90"
      PSX_INTERVAL_CLOSED_SECONDS: "1800"
      # Required for POST /internal/refresh. Override in a .env file.
      INTERNAL_TOKEN: "${INTERNAL_TOKEN:-change-me-in-production}"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
    restart: unless-stopped
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4",
             "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 384m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
