<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Pakistan Stock Exchange closing data and MUFAP mutual fund NAVs, refreshed on a schedule and served as an open JSON API."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000000'/%3E%3Cpath d='M7 21.5l5.5-6 4 3.5 8-10' fill='none' stroke='%2334d399' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>PK Finance — Pakistan Market Data</title>

    <script>
      // Resolve the theme before first paint. Without this the page renders
      // light, then repaints dark a frame later, which reads as a flicker on
      // every single navigation.
      (function () {
        // Black unless the viewer has explicitly asked for light. The OS
        // preference is not consulted: this is a dark product, and inheriting
        // a light desktop would hand most visitors a theme nobody designed.
        var theme = 'dark'
        try {
          if (localStorage.getItem('pkf.theme') === 'light') theme = 'light'
        } catch (e) {
          /* private browsing — stay dark */
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.style.background = theme === 'dark' ? '#000' : '#fff'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
