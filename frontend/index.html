<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta
      name="description"
      content="Pakistan Stock Exchange closing data and MUFAP mutual fund NAVs, refreshed on a schedule and served as an open JSON API."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0c'/%3E%3Cpath d='M7 21.5l5.5-6 4 3.5 8-10' fill='none' stroke='%2334d399' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Geist, not Inter. Inter is the default every generated interface
         reaches for, and it shows. Geist has more character at small sizes and
         its numerals sit better beside the mono. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>PK Finance — Pakistan market data, as an API</title>

  </head>
  <body>
    <!-- One theme. No toggle: a data product read at a desk does not need
         two palettes, and maintaining both halves the attention each gets. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
