name: Scrape (reusable)

# The scheduled half of the microservice. A run is a whole service lifecycle
# compressed into a minute: start, fetch one upstream, validate, publish a
# snapshot, exit. The pipeline it drives is the same code the HTTP deployment
# runs — see scripts/scrape.py.
#
# ── Why the cron is dense and the job exits early ────────────────────────────
# GitHub's `schedule` event is best effort, and on this repository it is a long
# way from punctual. Measured over five consecutive working days:
#
#     PSX    asked for 12:00 UTC   fired 16:17, 17:03, 16:49, 16:50, 18:11
#                                  — four to six hours late, every day
#     MUFAP  asked for 7 fires     got 1–2 a day; the rest were never created
#
# Nothing was cancelled and nothing failed: GitHub drops and delays scheduled
# runs, and that cannot be fixed from inside the repository. So the architecture
# stops depending on it being on time:
#
#   1. An external trigger calls repository_dispatch, which fires within
#      seconds. That is the punctual path — see docs/DEPLOYMENT.md.
#   2. The cron asks for far more fires than are needed, so whatever fraction
#      GitHub honours still lands near the intended times.
#   3. Every run first checks how long ago a fetch actually succeeded and exits
#      in seconds if one is not due — before installing anything. Asking for
#      fourteen fires therefore costs fourteen short jobs, not fourteen scrapes
#      of someone else's website.

on:
  workflow_call:
    inputs:
      domain:
        description: psx or mufap
        required: true
        type: string
      min_interval_minutes:
        description: >-
          Skip if the last successful fetch is younger than this. It guards a
          dense cron against double-fetching; it is not a check on whether the
          data looks current.
        type: number
        default: 0
      force:
        description: Fetch regardless of when the last one happened.
        type: boolean
        default: false
    outputs:
      status:
        description: ok | degraded | skipped | failed
        value: ${{ jobs.scrape.outputs.status }}
      records:
        description: Rows in the published snapshot.
        value: ${{ jobs.scrape.outputs.records }}

env:
  DATA_BRANCH: service-data
  # Measured peak for these jobs is well under 200 MiB. The ceiling turns a
  # runaway allocation into a MemoryError naming the limit, instead of an OOM
  # kill that surfaces as exit 137 with no traceback.
  #
  # It is set at 1 GiB rather than tight to the measurement because RLIMIT_AS
  # caps *address space*, and glibc reserves a 64 MiB arena per thread — up to
  # eight on a four-core runner. Most of that is never touched, but all of it
  # counts here, and a ceiling that close to the working set would fail runs
  # that were never actually short of memory.
  MAX_MEMORY_MB: '1024'
  # Two arenas instead of eight. This is the standard fix for glibc's
  # per-thread arena growth and genuinely lowers the footprint of a job whose
  # only threads are the one curl_cffi call.
  MALLOC_ARENA_MAX: '2'

jobs:
  scrape:
    name: ${{ inputs.domain }}
    runs-on: ubuntu-latest
    # Generous next to a normal run (~90s) and still a hard stop, so a hung
    # upstream cannot hold a runner for six hours.
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      # `skipped` comes from the due check, which runs before the refresh step
      # exists to report anything.
      status: ${{ steps.refresh.outputs.status || steps.due.outputs.status }}
      records: ${{ steps.refresh.outputs.records || steps.due.outputs.records }}

    steps:
      - name: Check out the service
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Restore the published snapshots
        run: |
          set -euo pipefail
          mkdir -p data
          if git fetch --no-tags --depth=1 origin "$DATA_BRANCH"; then
            git checkout FETCH_HEAD -- data 2>/dev/null \
              || echo "branch '$DATA_BRANCH' exists but holds no snapshots yet"
            echo "restored: $(ls -1 data 2>/dev/null | tr '\n' ' ')"
          else
            echo "no '$DATA_BRANCH' branch yet — this run starts cold"
          fi

      - name: Is a fetch due?
        id: due
        # Deliberately before setup-python and pip, because most fires are not
        # due and a fire that is not due must cost seconds rather than a minute.
        # Uses only the runner's preinstalled python and the snapshot just
        # restored — no network, no install.
        run: |
          python3 .github/scripts/fetch_due.py \
            --domain '${{ inputs.domain }}' \
            --data-dir data \
            --min-interval-minutes '${{ inputs.min_interval_minutes }}' \
            --force '${{ inputs.force }}'

      - name: Set up Python
        if: steps.due.outputs.due == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-scrape.txt

      - name: Install dependencies
        if: steps.due.outputs.due == 'true'
        # requirements-scrape.txt is the fetch-and-parse subset: no web
        # framework, no server. Five packages instead of nine, which is both a
        # faster install and a smaller resident footprint for the job.
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --quiet --no-compile --requirement requirements-scrape.txt

      - name: Refresh ${{ inputs.domain }}
        id: refresh
        if: steps.due.outputs.due == 'true'
        env:
          LOG_FORMAT: text
          # Identifies the client to the upstreams, with somewhere to complain
          # to. Both sites' robots.txt permit this access; saying who is asking
          # is the courtesy that goes with it.
          HTTP_USER_AGENT: >-
            Mozilla/5.0 (compatible; PK-Finance-Service/6.0;
            +https://github.com/${{ github.repository }})
        run: |
          # --force unconditionally: the due check above has already decided,
          # and deciding the same thing twice in two places is how the two come
          # to disagree.
          python scripts/scrape.py \
            --domain '${{ inputs.domain }}' \
            --data-dir data \
            --max-memory-mb "$MAX_MEMORY_MB" \
            --force

      - name: Publish the snapshot
        if: steps.refresh.outputs.status == 'ok' || steps.refresh.outputs.status == 'degraded'
        run: |
          chmod +x .github/scripts/publish-data.sh
          .github/scripts/publish-data.sh '${{ inputs.domain }}.'
