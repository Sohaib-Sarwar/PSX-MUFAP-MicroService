name: MUFAP — evening NAV

# MUFAP strikes NAV once per business day and publishes it some time during the
# evening, so the window 18:00–00:00 PKT (13:00–19:00 UTC) is swept hourly.
#
# The cron asks every 30 minutes — fourteen fires for seven wanted fetches —
# because GitHub delivers only one or two of seven hourly requests on this
# repository. `min_interval_minutes: 45` means a fetch happens at most once
# roughly per hour however many fires arrive, and every other fire exits in
# seconds without touching mufap.com.pk.
#
# For punctuality, drive repository_dispatch from an external scheduler.
# See docs/DEPLOYMENT.md.

on:
  schedule:
    - cron: '0,30 13-19 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: Fetch even if one happened within the last 45 minutes.
        type: boolean
        default: true

jobs:
  scrape:
    uses: ./.github/workflows/_scrape.yml
    permissions:
      contents: write
    concurrency:
      group: scrape-mufap
      cancel-in-progress: false
    with:
      domain: mufap
      min_interval_minutes: 45
      force: ${{ inputs.force == true }}

  publish:
    needs: scrape
    if: needs.scrape.outputs.status == 'ok' || needs.scrape.outputs.status == 'degraded'
    uses: ./.github/workflows/_pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      reason: MUFAP NAV
