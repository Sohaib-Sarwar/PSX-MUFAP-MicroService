name: MUFAP — evening NAV

# MUFAP strikes NAV once per business day and publishes it some time during the
# evening. The hour it lands varies, so the window is swept hourly:
#
#   13:00–19:00 UTC = 18:00, 19:00, 20:00, 21:00, 22:00, 23:00, 00:00 PKT,
#   Monday to Friday.
#
# Every run fetches and republishes. An earlier version skipped once the
# published validity date looked current, which saved requests but meant a
# correction issued at 22:00 to a NAV struck at 18:00 would never be collected.
# Seven fetches an evening is a small price for the published figure always
# being the one MUFAP is serving right now.

on:
  schedule:
    - cron: '0 13-19 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: Fetch even if the published snapshot is already current.
        type: boolean
        default: false

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  scrape:
    uses: ./.github/workflows/_scrape.yml
    permissions:
      contents: write
    with:
      domain: mufap
      force: ${{ inputs.force == true }}

  publish:
    needs: scrape
    if: needs.scrape.outputs.status != 'failed'
    uses: ./.github/workflows/_pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      reason: MUFAP NAV
