name: PSX — daily close

# One closing board per trading day, wanted at 17:00 PKT (12:00 UTC).
#
# The cron asks for six fires, 12:00 through 17:00 UTC, because GitHub delivers
# this one four to six hours late every single day and asking once means taking
# whatever hour it feels like. `min_interval_minutes: 600` means only the first
# fire that actually arrives does any work; the rest exit in seconds.
#
# For punctuality, do not rely on this at all — drive repository_dispatch from
# an external scheduler. See docs/DEPLOYMENT.md.

on:
  schedule:
    - cron: '0 12-17 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: Fetch even if one happened within the last 10 hours.
        type: boolean
        default: true

jobs:
  scrape:
    uses: ./.github/workflows/_scrape.yml
    permissions:
      contents: write
    # Per-domain, so a slow PSX run can never queue behind or cancel MUFAP.
    concurrency:
      group: scrape-psx
      cancel-in-progress: false
    with:
      domain: psx
      # Ten hours: one fetch per trading day, whichever fire GitHub honours.
      min_interval_minutes: 600
      force: ${{ inputs.force == true }}

  publish:
    needs: scrape
    if: needs.scrape.outputs.status == 'ok' || needs.scrape.outputs.status == 'degraded'
    uses: ./.github/workflows/_pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      reason: PSX close
