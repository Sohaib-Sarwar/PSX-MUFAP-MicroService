name: PSX — daily close

# PSX publishes one closing board per trading day. The previous deployment
# polled every 30 minutes around the clock; the market trades roughly 31 of the
# 168 hours in a week, so about four fetches in five returned a board that had
# not moved. One run after the close collects exactly the same data.
#
#   12:00 UTC = 17:00 PKT, Monday to Friday — after the close.
#
# Every run fetches. There is no "the published date already looks current"
# shortcut: the point of a scheduled refresh is to replace what is published
# with what the source says now, and a guard that skips on a date comparison
# is exactly how a stale board survives a whole day unnoticed.

on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: Fetch even if the published snapshot is already current.
        type: boolean
        default: false

# Shared with the MUFAP workflow: both publish to the same data branch, and one
# writer at a time is what keeps that branch consistent without locking.
concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  scrape:
    uses: ./.github/workflows/_scrape.yml
    permissions:
      contents: write
    with:
      domain: psx
      force: ${{ inputs.force == true }}

  publish:
    needs: scrape
    if: needs.scrape.outputs.status != 'failed'
    uses: ./.github/workflows/_pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      reason: PSX close
