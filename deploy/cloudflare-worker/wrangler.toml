name = "pk-finance-cron"
main = "worker.js"
compatibility_date = "2026-09-01"

# The manual GET trigger needs a public URL, so workers.dev stays on. Stated
# rather than left to default: the deploy warns about relying on the default,
# and a worker holding a repository-write token should not have its public
# surface decided implicitly.
workers_dev = true

# Off. Preview URLs give every uploaded version its own public hostname. The
# fetch route is guarded by TRIGGER_SECRET either way, but a worker that can
# write to a GitHub repository has no business exposing one endpoint per
# version when it only ever needs one.
preview_urls = false

# UTC, and deliberately the exact times the README promises. Cloudflare fires
# these within seconds; GitHub's own scheduler, asked for the same times, has
# been delivering the 12:00 run between 16:17 and 18:11 and dropping five of
# the seven evening runs. That gap is the entire reason this worker exists.
#
# Which domain each hour refreshes is decided by domainFor() in worker.js, and
# covered by schedule.test.mjs — one PSX fire and seven MUFAP fires a working
# day, with none wasted.
[triggers]
crons = [
  "0 12 * * 1-5",     # 17:00 PKT — PSX, after the close
  "0 13-19 * * 1-5",  # 18:00 → 00:00 PKT hourly — MUFAP
]

# Secrets are set with `npm run secrets`, never in this file:
#   GITHUB_TOKEN    fine-grained PAT, Contents: Read and write, this repo only
#   TRIGGER_SECRET  shared secret guarding the manual GET route
